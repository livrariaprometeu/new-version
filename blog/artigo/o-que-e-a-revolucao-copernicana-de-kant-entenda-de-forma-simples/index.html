                    "mainEntity": [

                        {
                            "@type": "Question",
                            "name": "O que é a revolução copernicana de Kant?",
                            "acceptedAnswer": {
                                "@type": "Answer",
                                "text": "É uma mudança de perspectiva na filosofia do conhecimento pela qual Kant investiga não apenas como nossa mente se adapta aos objetos, mas também como as condições da nossa faculdade de conhecer participam da estruturação da experiência."
                            }
                        },

                        {
                            "@type": "Question",
                            "name": "Por que Kant chama sua teoria de revolução copernicana?",
                            "acceptedAnswer": {
                                "@type": "Answer",
                                "text": "Kant compara sua mudança de perspectiva na filosofia à mudança realizada por Nicolau Copérnico na astronomia. Assim como Copérnico alterou o ponto de partida para explicar os movimentos celestes, Kant alterou o ponto de partida para investigar a relação entre sujeito e objeto no conhecimento."
                            }
                        },

                        {
                            "@type": "Question",
                            "name": "Kant acreditava que a mente cria a realidade?",
                            "acceptedAnswer": {
                                "@type": "Answer",
                                "text": "Não. Kant não afirma que cada pessoa inventa arbitrariamente a realidade. Sua tese é que os objetos enquanto aparecem na experiência são necessariamente conhecidos sob as condições da sensibilidade e do entendimento humanos."
                            }
                        },

                        {
                            "@type": "Question",
                            "name": "O que significa dizer que a mente participa da estruturação da experiência?",
                            "acceptedAnswer": {
                                "@type": "Answer",
                                "text": "Significa que a experiência humana não é uma simples recepção passiva de informações. Segundo Kant, a sensibilidade fornece representações e o entendimento organiza aquilo que é dado por meio de conceitos e categorias."
                            }
                        },

                        {
                            "@type": "Question",
                            "name": "O que é um fenômeno para Kant?",
                            "acceptedAnswer": {
                                "@type": "Answer",
                                "text": "Fenômeno é o objeto tal como aparece dentro das condições da experiência humana. É nesse campo que o conhecimento teórico humano pode operar."
                            }
                        },

                        {
                            "@type": "Question",
                            "name": "O que é a coisa em si para Kant?",
                            "acceptedAnswer": {
                                "@type": "Answer",
                                "text": "A coisa em si é o objeto considerado independentemente das condições pelas quais ele aparece para a experiência humana. Kant sustenta que não podemos obter conhecimento teórico da coisa em si da mesma maneira que conhecemos os fenômenos."
                            }
                        },

                        {
                            "@type": "Question",
                            "name": "Qual é a diferença entre fenômeno e coisa em si?",
                            "acceptedAnswer": {
                                "@type": "Answer",
                                "text": "O fenômeno é o objeto tal como aparece dentro das condições da experiência humana, enquanto a coisa em si é considerada independentemente dessas condições. Para Kant, nosso conhecimento teórico está limitado aos fenômenos."
                            }
                        },

                        {
                            "@type": "Question",
                            "name": "Qual é o papel do espaço e do tempo na filosofia de Kant?",
                            "acceptedAnswer": {
                                "@type": "Answer",
                                "text": "Para Kant, espaço e tempo são formas a priori da sensibilidade. Eles constituem condições fundamentais pelas quais os objetos podem ser percebidos na experiência humana."
                            }
                        },

                        {
                            "@type": "Question",
                            "name": "O que são as categorias do entendimento de Kant?",
                            "acceptedAnswer": {
                                "@type": "Answer",
                                "text": "São conceitos fundamentais e a priori do entendimento que permitem organizar e pensar aquilo que é dado na experiência. Kant apresenta doze categorias, distribuídas entre quantidade, qualidade, relação e modalidade."
                            }
                        },

                        {
                            "@type": "Question",
                            "name": "O que a revolução copernicana tem a ver com a Crítica da Razão Pura?",
                            "acceptedAnswer": {
                                "@type": "Answer",
                                "text": "A revolução copernicana é uma das ideias centrais da Crítica da Razão Pura. Ela está relacionada ao projeto de Kant de explicar como o conhecimento é possível a partir das condições a priori da sensibilidade e do entendimento."
                            }
                        },

                        {
                            "@type": "Question",
                            "name": "Kant era idealista?",
                            "acceptedAnswer": {
                                "@type": "Answer",
                                "text": "Kant é associado ao idealismo transcendental. Essa posição afirma que os objetos da experiência são conhecidos dentro das condições a priori da sensibilidade e do entendimento, sem significar que os objetos físicos sejam simplesmente invenções da mente."
                            }
                        },

                        {
                            "@type": "Question",
                            "name": "A revolução copernicana de Kant significa que tudo é subjetivo?",
                            "acceptedAnswer": {
                                "@type": "Answer",
                                "text": "Não. Embora o conhecimento humano dependa de condições estruturais do sujeito, essas condições não são arbitrárias ou individuais. Kant procura justamente explicar como é possível haver conhecimento objetivo da experiência."
                            }
                        },

                        {
                            "@type": "Question",
                            "name": "Por que a revolução copernicana de Kant é importante?",
                            "acceptedAnswer": {
                                "@type": "Answer",
                                "text": "Ela mudou profundamente a investigação filosófica sobre o conhecimento ao colocar no centro da análise as condições que tornam possível a experiência e o conhecimento dos objetos. A ideia influenciou profundamente a filosofia posterior."
                            }
                        },

                        {
                            "@type": "Question",
                            "name": "Em qual obra Kant apresenta a revolução copernicana?",
                            "acceptedAnswer": {
                                "@type": "Answer",
                                "text": "A ideia aparece principalmente na Crítica da Razão Pura, publicada originalmente em 1781 e revisada em 1787. Na segunda edição, Kant apresenta explicitamente a comparação de sua mudança de perspectiva com a revolução realizada por Copérnico."
                            }
                        },

                        {
                            "@type": "Question",
                            "name": "A revolução copernicana de Kant significa que não podemos conhecer a realidade?",
                            "acceptedAnswer": {
                                "@type": "Answer",
                                "text": "Não. Kant não afirma simplesmente que o conhecimento é impossível. Ele sustenta que conhecemos os objetos enquanto fenômenos, dentro das condições da experiência possível, e que existem limites para o conhecimento teórico."
                            }
                        }
