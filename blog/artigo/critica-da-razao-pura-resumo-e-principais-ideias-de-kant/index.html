                        {
                            "@type": "Question",
                            "name": "O que é a Crítica da Razão Pura?",
                            "acceptedAnswer": {
                                "@type": "Answer",
                                "text": "É uma obra de Immanuel Kant dedicada à investigação das possibilidades e dos limites do conhecimento humano, especialmente do conhecimento a priori e da metafísica."
                            }
                        },
                        {
                            "@type": "Question",
                            "name": "Qual é a principal ideia da Crítica da Razão Pura?",
                            "acceptedAnswer": {
                                "@type": "Answer",
                                "text": "Uma das ideias centrais é que o conhecimento humano depende tanto da experiência quanto de estruturas a priori da sensibilidade e do entendimento. Conhecemos os objetos enquanto fenômenos, dentro das condições que tornam possível nossa experiência."
                            }
                        },
                        {
                            "@type": "Question",
                            "name": "O que significa a priori em Kant?",
                            "acceptedAnswer": {
                                "@type": "Answer",
                                "text": "É aquilo cuja validade não depende de uma experiência particular. Kant utiliza o conceito para investigar conhecimentos e estruturas que possuem caráter necessário e universal."
                            }
                        },
                        {
                            "@type": "Question",
                            "name": "O que significa a posteriori?",
                            "acceptedAnswer": {
                                "@type": "Answer",
                                "text": "É aquilo que depende da experiência. Conhecimentos empíricos são exemplos de conhecimentos a posteriori."
                            }
                        },
                        {
                            "@type": "Question",
                            "name": "O que são juízos sintéticos a priori?",
                            "acceptedAnswer": {
                                "@type": "Answer",
                                "text": "São juízos que acrescentam conhecimento novo sem depender de uma experiência particular para sua validade. Kant considera a possibilidade dos juízos sintéticos a priori uma das questões fundamentais de sua investigação filosófica."
                            }
                        },
                        {
                            "@type": "Question",
                            "name": "O que é a revolução copernicana de Kant?",
                            "acceptedAnswer": {
                                "@type": "Answer",
                                "text": "É a mudança de perspectiva pela qual Kant investiga não apenas como o conhecimento se adapta aos objetos, mas também quais condições do sujeito tornam possível a experiência e o conhecimento dos objetos."
                            }
                        },
                        {
                            "@type": "Question",
                            "name": "O que é um fenômeno para Kant?",
                            "acceptedAnswer": {
                                "@type": "Answer",
                                "text": "Fenômeno é o objeto enquanto aparece dentro das condições possíveis da experiência humana. O conhecimento teórico humano se refere aos objetos enquanto fenômenos."
                            }
                        },
                        {
                            "@type": "Question",
                            "name": "O que é a coisa em si para Kant?",
                            "acceptedAnswer": {
                                "@type": "Answer",
                                "text": "A coisa em si é o objeto considerado independentemente das condições específicas pelas quais os seres humanos o conhecem. Kant sustenta que não podemos obter conhecimento teórico da coisa em si."
                            }
                        },
                        {
                            "@type": "Question",
                            "name": "Kant acreditava que o mundo não existe?",
                            "acceptedAnswer": {
                                "@type": "Answer",
                                "text": "Não. Essa interpretação simplifica excessivamente sua filosofia. Kant investiga as condições do conhecimento humano e distingue os objetos enquanto aparecem para nós dos objetos considerados independentemente dessas condições."
                            }
                        },
                        {
                            "@type": "Question",
                            "name": "O que são as categorias do entendimento de Kant?",
                            "acceptedAnswer": {
                                "@type": "Answer",
                                "text": "São conceitos a priori do entendimento que desempenham um papel fundamental na organização da experiência. Kant apresenta doze categorias, distribuídas entre quantidade, qualidade, relação e modalidade."
                            }
                        },
                        {
                            "@type": "Question",
                            "name": "Kant era racionalista ou empirista?",
                            "acceptedAnswer": {
                                "@type": "Answer",
                                "text": "Kant procurou superar a oposição entre racionalismo e empirismo. Ele reconhece a importância da experiência, mas também sustenta que existem estruturas a priori fundamentais para que a experiência possa constituir conhecimento objetivo."
                            }
                        },
                        {
                            "@type": "Question",
                            "name": "Por que Kant critica a metafísica?",
                            "acceptedAnswer": {
                                "@type": "Answer",
                                "text": "Kant critica a pretensão de obter conhecimento teórico sobre objetos que estão além da experiência possível. Seu objetivo é determinar os limites dentro dos quais a razão pode produzir conhecimento legítimo."
                            }
                        },
                        {
                            "@type": "Question",
                            "name": "O que é o idealismo transcendental de Kant?",
                            "acceptedAnswer": {
                                "@type": "Answer",
                                "text": "É a posição segundo a qual os objetos da experiência são conhecidos dentro das condições a priori da sensibilidade e do entendimento humano. Kant distingue esses fenômenos dos objetos considerados independentemente dessas condições."
                            }
