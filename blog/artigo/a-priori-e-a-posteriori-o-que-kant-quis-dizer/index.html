                        {
                            "@type": "Question",
                            "name": "O que significa a priori em Kant?",

                                "@type": "Answer",

                        },

                        {
                            "@type": "Question",
                            "name": "O que significa a posteriori em Kant?",

                                "@type": "Answer",
