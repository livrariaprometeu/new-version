                        {
                            "@type": "Question",
                            "name": "O que é fenômeno para Kant?",
                            "acceptedAnswer": {
                                "@type": "Answer",
                                "text": "Fenômeno é o objeto tal como aparece dentro das condições da experiência humana. Para Kant, é nesse domínio que o conhecimento teórico pode ocorrer."
                            }
                        },

                        {
                            "@type": "Question",
                            "name": "O que é coisa em si em Kant?",
                            "acceptedAnswer": {
                                "@type": "Answer",
                                "text": "A coisa em si é a realidade considerada independentemente da maneira como aparece à experiência humana. Kant sustenta que não podemos conhecê-la teoricamente da mesma forma que conhecemos os fenômenos."
                            }
                        },

                        {
                            "@type": "Question",
                            "name": "Qual é a diferença entre fenômeno e coisa em si?",

                        },

                        {

                            }
                        },

                        {
                            "@type": "Question",

                            }
                        },

                        {
                            "@type": "Question",
                            "name": "Fenômeno significa uma aparência falsa para Kant?",

                                "text": "Não. Fenômeno não significa ilusão ou aparência falsa. Em Kant, fenômeno é o objeto enquanto aparece dentro das condições da experiência humana e pode ser conhecido."
                            }
                        },

                        },

                        },

                        },

                            }
                        },

                        {
                            "@type": "Question",
                            "name": "O que são as categorias do entendimento em Kant?",
