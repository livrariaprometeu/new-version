                    {
                    "@type": "Question",
                    "name": "Quem foi Immanuel Kant?",
                    "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "Immanuel Kant foi um filósofo prussiano do século XVIII, considerado uma das figuras mais importantes da filosofia moderna. É conhecido principalmente por sua filosofia crítica, pelas contribuições à teoria do conhecimento e por sua ética baseada no imperativo categórico."
                    }
                    },
                    {
                    "@type": "Question",
                    "name": "Qual é a principal obra de Immanuel Kant?",
                    "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "A Crítica da Razão Pura, publicada originalmente em 1781 e posteriormente revisada em 1787, é considerada uma das principais obras de Immanuel Kant. Nela, Kant investiga as condições e os limites do conhecimento humano."
                    }
                    },
                    {
                    "@type": "Question",
                    "name": "O que é o imperativo categórico de Kant?",
                    "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "O imperativo categórico é um princípio central da ética de Immanuel Kant. De forma geral, ele estabelece que uma ação moral deve seguir princípios que possam ser considerados válidos universalmente, tratando as pessoas sempre como fins em si mesmas e nunca apenas como meios."
                    }
                    },
                    {
                    "@type": "Question",
                    "name": "O que Kant defendia sobre o conhecimento?",
                    "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "Kant argumentava que o conhecimento resulta da relação entre aquilo que é fornecido pela experiência e as estruturas pelas quais a mente humana organiza essa experiência. Sua filosofia buscou superar a oposição entre racionalismo e empirismo."
                    }
                    },
                    {
                    "@type": "Question",
                    "name": "O que são fenômeno e númeno em Kant?",
                    "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "Para Kant, fenômeno é aquilo que pode ser conhecido pela experiência humana, enquanto númeno se refere à realidade considerada independentemente da forma como aparece à nossa experiência. A distinção estabelece limites para o conhecimento humano."
                    }
                    },
                    {
                    "@type": "Question",
                    "name": "Kant era iluminista?",
                    "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "Sim. Immanuel Kant é uma das principais figuras do Iluminismo alemão. Em seu ensaio O que é o Esclarecimento?, defendeu o uso público da razão e a autonomia intelectual, associado à ideia de que as pessoas deveriam ter coragem de utilizar seu próprio entendimento."
                    }
                    },
                    {
                    "@type": "Question",
                    "name": "O que Kant pensava sobre liberdade?",
                    "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "Para Kant, a liberdade está profundamente relacionada à autonomia moral. Ser livre não significa simplesmente fazer aquilo que se deseja, mas agir segundo princípios racionais e moralmente justificáveis que o próprio indivíduo reconhece como válidos."
                    }
                    },
                    {
                    "@type": "Question",
                    "name": "Por que Immanuel Kant é importante para a filosofia?",
                    "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "Kant transformou profundamente a filosofia ao investigar os limites e as condições do conhecimento, reformular questões da metafísica e desenvolver uma influente teoria ética baseada na autonomia e no dever. Suas ideias exerceram influência sobre diversas correntes da filosofia posterior."
